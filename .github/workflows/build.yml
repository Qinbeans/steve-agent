name: Build

# Windows and macOS can only be built and run on those systems, so this is what proves them.
# release.yml calls this for a new version of the app. Run it by hand to check a build without releasing.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm bubblewrap
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: steve-desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: astral-sh/setup-uv@v5

      - name: Install the app's dependencies
        working-directory: steve-desktop
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        working-directory: steve-desktop
        run: pnpm vitest run
      - name: Rust tests
        working-directory: steve-desktop/src-tauri
        run: cargo test --lib
      - name: Build the packages
        working-directory: steve-desktop
        run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: steve-${{ runner.os }}
          if-no-files-found: error
          path: |
            steve-desktop/src-tauri/target/**/release/bundle/deb/*.deb
            steve-desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            steve-desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            steve-desktop/src-tauri/target/**/release/bundle/dmg/*.dmg

      - name: The CLI installs and serves
        shell: bash
        working-directory: steve-cli
        run: |
          uv tool install .
          export PATH="$(uv tool dir --bin):$PATH"
          home="$RUNNER_TEMP/steve-home"
          mkdir -p "$home/.config/steve/agents/memories" "$home/.config/steve/agents/skills"
          touch "$home/.config/steve/agents/AGENTS.md" "$home/.config/steve/agents/memories/MEMORY.md"
          printf 'model:\n  model: fake\n  base_url: http://127.0.0.1:9/v1\n  api_key: k\n' > "$home/.config/steve/config.yaml"
          export HOME="$home" USERPROFILE="$home"
          steve-agent serve --port 18765 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:18765/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/serve.log"
          exit 1

  # Only when run by hand, not for a release. Not required to pass yet: this finds out what the suite
  # assumes about Linux.
  cli-tests:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Tests
        working-directory: steve-cli
        run: uv run --frozen pytest -q
