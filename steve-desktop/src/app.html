<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steve</title>
    <script>
      // Before the first paint, so the splash starts in the chosen theme. mode-watcher takes over later.
      try {
        const stored = localStorage.getItem("mode-watcher-mode");
        const dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      } catch {
        // The splash then follows the system's theme through its media query.
      }
    </script>
    <style>
      /* Here and not in the app's CSS, so that it shows before any of the app has loaded. */
      #splash {
        --splash-bg: oklch(0.97 0.012 75);
        --splash-a: oklch(0.9 0.09 75 / 0.9);
        --splash-b: oklch(0.92 0.06 95 / 0.8);
        --splash-fg: oklch(0.145 0 0);
        --splash-muted: oklch(0.556 0 0);
        --splash-track: oklch(0.922 0 0);
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background:
          radial-gradient(60% 55% at 12% 18%, var(--splash-a), transparent 70%),
          radial-gradient(65% 50% at 78% 92%, var(--splash-b), transparent 70%),
          var(--splash-bg);
        color: var(--splash-fg);
        font-family: ui-sans-serif, system-ui, sans-serif;
        transition: opacity 150ms ease-out;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light) #splash {
          --splash-bg: oklch(0.15 0.012 60);
          --splash-a: oklch(0.38 0.09 60 / 0.75);
          --splash-b: oklch(0.36 0.08 85 / 0.5);
          --splash-fg: oklch(0.985 0 0);
          --splash-muted: oklch(0.708 0 0);
          --splash-track: oklch(0.269 0 0);
        }
      }
      html.dark #splash {
        --splash-bg: oklch(0.15 0.012 60);
          --splash-a: oklch(0.38 0.09 60 / 0.75);
          --splash-b: oklch(0.36 0.08 85 / 0.5);
        --splash-fg: oklch(0.985 0 0);
        --splash-muted: oklch(0.708 0 0);
        --splash-track: oklch(0.269 0 0);
      }
      html.dark body,
      html:not(.light) body {
        background: var(--splash-bg);
      }
      #splash.leaving {
        opacity: 0;
        pointer-events: none;
      }
      #splash-image {
        width: min(16rem, 40vh);
        height: auto;
      }
      #splash-name {
        font-size: 1.25rem;
        font-weight: 600;
      }
      #splash-spinner {
        width: 1.25rem;
        height: 1.25rem;
        border: 2px solid var(--splash-track);
        border-top-color: var(--splash-fg);
        border-radius: 50%;
        animation: splash-spin 800ms linear infinite;
      }
      #splash-status {
        margin: 0;
        font-size: 0.875rem;
        color: var(--splash-muted);
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-spinner {
          animation-duration: 3s;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="splash" data-testid="splash">
      <img id="splash-image" src="%sveltekit.assets%/splash.png" alt="" />
      <div id="splash-name">Steve</div>
      <div id="splash-spinner" aria-hidden="true"></div>
      <p id="splash-status" role="status">Loading…</p>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
